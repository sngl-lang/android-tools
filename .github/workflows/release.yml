# Builds every tool in `versions` on each host, smoke-tests the pair, and on a
# v* tag publishes them all as one release with SHA256SUMS. native-image
# cannot cross-compile, so each os/arch is its own runner.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: windows-2025, os: windows, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          grep -v '^#' versions | while read -r tool version; do
            [ -n "$tool" ] || continue
            "$tool/build.sh" "$version" "dist/$tool-$version"
          done

      - name: Smoke test
        run: |
          kotlinc=$(ls -d dist/kotlinc-* | head -n1)
          d8=$(ls -d dist/d8-* | head -n1)
          smoke/run.sh "$kotlinc" "$d8"

      - name: Package
        run: |
          mkdir out
          cd dist
          for d in *; do
            name=$d-${{ matrix.os }}-${{ matrix.arch }}
            if [ "${{ matrix.os }}" = windows ]; then
              7z a -tzip "../out/$name.zip" "./$d/*" >/dev/null
            else
              tar -C "$d" -czf "../out/$name.tar.gz" .
            fi
          done
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Native builds of $(ls out | grep -v SHA256SUMS | sed -E 's/-(linux|darwin|windows)-.*//' | sort -u | paste -sd, -). See README.md for how each is run."
